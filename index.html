<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Form</title>
<style>
  body { font-family: system-ui; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f4f5; }
  form { background: #fff; padding: 24px; border-radius: 12px; display: grid; gap: 10px; width: 320px; box-shadow: 0 2px 12px #0001; }
  input, textarea, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { background: #111; color: #fff; border: 0; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  #msg { margin: 0; text-align: center; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>

<form id="f">
  <h3 style="margin:0">Contact us</h3>
  <input name="name" placeholder="Name" required>
  <input name="email" type="email" placeholder="Email" required>
  <textarea name="message" placeholder="Message" rows="3"></textarea>
  <button id="btn">Submit</button>
  <p id="msg"></p>
</form>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwAKpY3T54BOnNrH-sK2QwczlzdAe80OLupgbbQhKud7TCbe3wkqgjuaRuxeppsYSm6xg/exec";
const f = document.getElementById("f");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

f.onsubmit = async e => {
  e.preventDefault();
  btn.disabled = true;
  msg.textContent = "Sending...";
  msg.style.color = "#666";

  try {
    await fetch(URL, { method: "POST", mode: "no-cors", body: new FormData(f) });
    msg.textContent = "✅ Submitted successfully!";
    msg.style.color = "green";
    f.reset();
  } catch (err) {
    msg.textContent = "❌ Failed. Please try again.";
    msg.style.color = "red";
  }
  
  btn.disabled = false;
};
</script>
</body>
</html>
