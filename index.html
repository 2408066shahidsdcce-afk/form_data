<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Form</title>
</head>
<body>

<form id="f">
  <h3 style="margin:0">Contact us</h3>
  <input name="name" placeholder="Name" required>
  <input name="email" type="email" placeholder="Email" required>
  <textarea name="message" placeholder="Message" rows="3"></textarea>
  <button>Submit</button>
</form>
<script>
const URL = "https://script.google.com/macros/s/AKfycbyO7MVYan_fr-HYlXLQs2-V4ztwyul7OfiQrzTeWTnrRtMpQYb3qtf1Ipr2RriqzdYxdA/exec";
const f = document.getElementById("f");

f.onsubmit = async e => {
  e.preventDefault();
  try {
    await fetch(URL, { method: "POST", mode: "no-cors", body: new FormData(f) });
  } catch(e) {
    console.log(e)
  }
};
</script>
</body>
</html>
